name: Build David artist mesh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: pip install numpy

      - name: Build deterministic browser mesh
        run: python tools/build_mesh.py

      - name: Commit generated mesh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/david-head.dlb
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild David artist mesh"
          git push origin HEAD:main
